[project]
name = "lmml"
dynamic = ["version"]
description = "CLI toolkit for RL / LLM / ML training with Hydra + Lightning + WandB"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate",
    "datasets",
    "einops",
    "gymnasium[classic-control]",
    "hydra-core",
    "lightning",
    "numpy",
    "omegaconf",
    "peft",
    "rich",
    "safetensors",
    "torch",
    "transformers",
    "wandb",
]

# 注册命令行 CLI 命令
[project.scripts]
lmml = "lmml.cli:main"

[tool.hatch.version]
path = "src/lmml/__about__.py"

# 可选：额外依赖组
[project.optional-dependencies]
h5 = ["h5py"]
parquet = ["pyarrow"]
gpu = [
    "bitsandbytes",
    "flash-linear-attention",
    "torchao",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.3.0",
]

# hatchling
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmml"]   # configs/**/*.yaml 位于包内，会被自动打进 wheel

# pytest 针对 src layout 的推荐配置
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

#[tool.uv]
#environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]
