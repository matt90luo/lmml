[project]
name = "lmml"
dynamic = ["version"]
description = "CLI toolkit for RL / LLM / ML training with Hydra + Lightning + WandB"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate",
    "datasets",
    "einops",
    "gymnasium[classic-control]",
    "hydra-core",
    "lightning",
    "numpy",
    "omegaconf",
    "peft",
    "pydantic>=2.9",
    "rich",
    "safetensors",
    "torch",
    "flash-attn",
    "torchao>=0.16.0",
    "transformers",
    "wandb",
    "liger-kernel"
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
flash-attn = { index = "astral-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "astral-cu132"
url = "https://wheels.astral.sh/simple/cu132/"
explicit = true


# 注册命令行 CLI 命令
[project.scripts]
lmml = "lmml.cli:main"

[tool.hatch.version]
path = "src/lmml/__about__.py"

# 可选：额外依赖组
[project.optional-dependencies]
h5 = ["h5py"]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
parquet = ["pyarrow"]
gpu = [
    "bitsandbytes",
    "flash-linear-attention",
    "torchao>=0.16.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.3.0",
]

# hatchling
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmml"]   # configs/**/*.yaml 位于包内，会被自动打进 wheel
artifacts = ["src/lmml/configs/**/*.yaml", "src/lmml/assets/**/*"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/lmml/configs/**/*.yaml", "src/lmml/assets/**/*"]

# pytest 针对 src layout 的推荐配置
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

#[tool.uv]
#environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]
