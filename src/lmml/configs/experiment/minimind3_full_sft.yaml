# @package _global_
defaults:
  - override /recipe: causal_lm_sft
  - override /algo: minimind_sft_full
  - override /data: minimind_sft_mix
  - override /trainer: colab_sft
  - override /net: null
  - override /env: null
  - override /collect: null

optimized_metric: val/loss
eval:
  enabled: false
callbacks:
  checkpoint:
    dirpath: ${paths.base_dir}/checkpoints_minimind3_full_sft
    filename: minimind3-full-sft-{epoch:02d}-{step:06d}
    monitor: val/loss
    mode: min
    save_top_k: 1
    save_last: true
    save_weights_only: false
logger:
  project: lmml-projects
  name: minimind3-full-sft
  tags: [llm, minimind, minimind3_full_sft]
