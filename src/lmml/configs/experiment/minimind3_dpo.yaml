# @package _global_
defaults:
  - override /recipe: causal_lm_dpo
  - override /algo: minimind_dpo
  - override /data: minimind_dpo
  - override /trainer: colab_rl
  - override /net: null
  - override /env: null
  - override /collect: null

optimized_metric: val/loss
eval:
  enabled: false
callbacks:
  checkpoint:
    dirpath: ${paths.base_dir}/checkpoints_minimind3_dpo
    filename: minimind3-dpo-{step:06d}
    monitor: val/loss
    mode: min
    save_top_k: 1
    save_last: true
    save_weights_only: false
logger:
  project: lmml-projects
  name: minimind3-dpo
  tags: [llm, minimind, minimind3_dpo]
