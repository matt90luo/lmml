# @package _global_
defaults:
  - override /recipe: causal_lm_agent_rl
  - override /algo: minimind_agent_rl
  - override /data: minimind_agent_rl
  - override /trainer: colab_rl
  - override /net: null
  - override /env: null
  - override /collect: null

optimized_metric: train/loss
eval:
  enabled: false
callbacks:
  checkpoint:
    dirpath: ${paths.base_dir}/checkpoints_minimind3_agent_rl
    filename: minimind3-agent-rl-{step:06d}
    monitor: train/loss
    mode: min
    save_top_k: 1
    save_last: true
    save_weights_only: false
logger:
  project: lmml-projects
  name: minimind3-agent-rl
  tags: [llm, minimind, minimind3_agent_rl]
