# @package _global_
defaults:
  - override /env: cartpole
  - override /data: online
  - override /net: mlp

algo:
  lr: 1.0e-3
  n_step: 3
  v_min: 0.0
  v_max: 200.0
  target_update:
    mode: hard
    every: 100

data:
  online_cold_start_steps: 1000
  steps_per_epoch: 500

trainer:
  max_epochs: 15
