task: kev
prepared_path: ${paths.prepared_data_dir}/kev_suits
overwrite: true
tokenizer_name_or_path: ${algo.model.name_or_path}
sources:
  - path: ${paths.kev_data_dir}/v7/decision-v7
    max_samples: null
    sample_ratio: 1.0
  - path: ${paths.kev_data_dir}/documents-v1
    max_samples: null
    sample_ratio: 1.0
  - path: ${paths.kev_data_dir}/hard-v1
    max_samples: null
    sample_ratio: 1.0
fallback_sources:
  - path: ${paths.kev_data_dir}/decision-v2
    split: train
    role: train
    max_samples: null
    sample_ratio: 1.0
  - path: ${paths.kev_data_dir}/v3/decision-v3
    split: train
    role: train
    max_samples: null
    sample_ratio: 1.0
max_state: 384
max_branch: 1024
max_train_samples: null
max_val_samples: 2000
batch_size: 1
val_batch_size: 1
num_workers: 0
chat_end_token: "<|im_end|>"
predict_requests:
  - state:
      user_id: U-9402
      text: 你们的扣费系统是不是有毛病？上周多扣了我两次费用，马上退款，否则投诉消协！
      history_disputes: 0
    questions:
      asks_for_refund:
        type: noul
        instructions: Does the customer explicitly demand a refund of money?
      routing_queue:
        type: choice
        instructions: Which department should handle this request?
        criteria:
          billing: Issues with recurring payments, charges, cards, or receipts
          account_security: Compromised accounts, password resets, 2FA failures
          technical_support: App crashes, 5xx errors, API bugs
          general_inquiry: Other non-urgent questions
      customer_frustration:
        type: score
        instructions: Rate the level of user emotional frustration and hostility.
        criteria:
          - "Level 0: Calm, objective, neutral tone"
          - "Level 1: Annoyed, mildly impatient but polite"
          - "Level 2: Openly aggressive, angry, threatening legal or external escalations"
