task: jev
prepared_path: ${paths.prepared_data_dir}/jev_distill_corpus_v3
overwrite: true
resume: auto
sampling_strategy: reservoir
store_tokenized: true
preprocessing_num_proc: auto
tokenization_batch_size: 512
shard_size: 20000
progress_every: 10000
tokenizer_name_or_path: ${algo.model.name_or_path}
sources:
  - path: ${paths.jev_data_dir}
    max_samples: null
    sample_ratio: 1.0
max_length: 512
filter_overlong: true
strict_length: false
training_sampling: source_kind_round_robin
# Preprocessing caps (null = keep all source rows). Training-time sampling is
# controlled separately by train_max_samples / val_max_samples below.
max_train_samples: null
max_val_samples: null
max_calibration_samples: null
max_test_samples: null
max_test_30k_samples: null
max_ood_samples: null
# Training-time sampling: do not re-prepare the 643k-row corpus just to shrink
# one run. Set train_max_samples=null to consume the full train split.
train_max_samples: 64000
val_max_samples: 1024
train_sampling: source_kind_round_robin
sample_seed: 42
batch_size: 2
val_batch_size: 4
num_workers: 0
chat_end_token: "<|im_end|>"
predict_requests:
  - state:
      user_id: U-9402
      text: 你们的扣费系统是不是有毛病？上周多扣了我两次费用，马上退款，否则投诉消协！
      history_disputes: 0
    questions:
      asks_for_refund:
        type: noul
        instructions: Does the customer explicitly demand a refund of money?
      routing_queue:
        type: choice
        instructions: Which department should handle this request?
        criteria:
          billing: Issues with recurring payments, charges, cards, or receipts
          account_security: Compromised accounts, password resets, 2FA failures
          technical_support: App crashes, 5xx errors, API bugs
          general_inquiry: Other non-urgent questions
      customer_frustration:
        type: score
        instructions: Rate the level of user emotional frustration and hostility.
        criteria:
          - "Level 0: Calm, objective, neutral tone"
          - "Level 1: Annoyed, mildly impatient but polite"
          - "Level 2: Openly aggressive, angry, threatening legal or external escalations"
