defaults:
  - recipe: rainbow
  - algo: rainbow
  - net: mlp
  - env: gridworld
  - data: online
  - trainer: default
  - logger: tensorboard
  - callbacks: default
  - collect: default
  - _self_
  - experiment: null

command: train
seed: 42
ckpt_path: null
resume_from: null
test_after_train: false
optimized_metric: val/episode_return

eval:
  enabled: true
  episodes: 5
  every_n_epochs: 1

predict:
  obs_path: null
  output: predictions.npz
  batch_size: 64

hydra:
  run:
    dir: outputs/${command}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${command}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: "${hydra.job.num}"
