defaults:
  - recipe: rainbow
  - algo: rainbow
  - net: mlp
  - env: gridworld
  - data: online
  - trainer: default
  - logger: wandb
  - callbacks: default
  - collect: default
  - _self_
  - experiment: null

command: train
seed: 42
ckpt_path: null
resume_from: null
test_after_train: false
optimized_metric: val/episode_return

paths:
  base_dir: /content
  # 权重通过 `hf download ... --local-dir /content/<model>` 放在本地 /content；
  # 数据集仍保留在 Google Drive，避免改变现有数据路径。
  base_data_dir: /content/drive/MyDrive/colab-notes/data/datasets
  # 基座权重从 HF 下载到本地 /content；训练产物仍写回 Google Drive。
  base_model_dir: /content
  output_model_dir: /content/drive/MyDrive/colab-notes/data/models
  kev_data_dir: ${paths.base_data_dir}/kev-suits
  jev_data_dir: ${paths.base_data_dir}/jev-distill-corpus-v3
  prepared_data_dir: ${paths.base_data_dir}/prepared

eval:
  enabled: true
  episodes: 5
  every_n_epochs: 1

predict:
  obs_path: null
  prompts: null
  output: predictions.npz
  batch_size: 64

hydra:
  run:
    dir: outputs/${command}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${command}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: "${hydra.job.num}"
